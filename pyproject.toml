[project]
name = "alt-oracle"
version = "0.1.0"
description = "An AI powered chatbot for answering questions about various SEBI regulations on Alternative Investments"
authors = [
    {name = "Kamalakar Chaudhari",email = "chaudhari.ky@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langgraph (>=0.5.4,<0.6.0)",
    "ipykernel (>=6.30.0,<7.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "llama-index (>=0.13.0)",
    "llama-index-llms-groq (>=0.4.0)",
    "llama-index-llms-openai (>=0.4.0)",
    "llama-index-embeddings-openai (>=0.4.0)",
    "openai (>=1.0.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "mail-parser (>=4.1.4,<5.0.0)",
    "groq (>=0.30.0,<0.31.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "pydantic (>=2.0.0,<3.0.0)",
    "pandas (>=2.0.0,<2.3.0)",
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
